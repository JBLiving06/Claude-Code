<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Demo 3: Exam Prep System — NotebookLM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&family=Fira+Code:wght@400&display=swap');

  :root {
    --nb-bg: #f8f9fa;
    --nb-sidebar-bg: #ffffff;
    --nb-accent: #1a73e8;
    --nb-accent-light: #e8f0fe;
    --nb-text: #202124;
    --nb-text-sec: #5f6368;
    --nb-border: #dadce0;
    --nb-source-bg: #f1f3f4;
    --nb-chat-bg: #ffffff;
    --nb-user-bg: #e8f0fe;
    --nb-green: #137333;
    --nb-correct: #137333;
    --nb-warning: #e37400;
    --nb-error: #c5221f;
  }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Roboto', 'Google Sans', -apple-system, sans-serif;
    background: var(--nb-bg);
    color: var(--nb-text);
  }

  .container {
    display: flex;
    width: 1920px;
    height: 1080px;
  }

  /* Source Panel */
  .source-panel {
    width: 340px;
    background: var(--nb-sidebar-bg);
    border-right: 1px solid var(--nb-border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .source-header {
    padding: 20px 20px 12px;
    border-bottom: 1px solid var(--nb-border);
  }
  .source-header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .nb-logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #4285f4, #34a853, #fbbc04, #ea4335);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .nb-logo svg {
    width: 18px; height: 18px; fill: white;
  }
  .nb-title {
    font-family: 'Google Sans', sans-serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--nb-text);
  }
  .notebook-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--nb-text);
    padding: 4px 0;
  }
  .source-count {
    font-size: 12px;
    color: var(--nb-text-sec);
    margin-top: 2px;
  }
  .source-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
  }
  .source-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 2px;
    cursor: pointer;
    opacity: 0;
    transform: translateX(-10px);
    transition: opacity 0.3s ease, transform 0.3s ease, background 0.15s;
  }
  .source-item.visible {
    opacity: 1;
    transform: translateX(0);
  }
  .source-item:hover { background: var(--nb-source-bg); }
  .source-check {
    width: 18px; height: 18px;
    border: 2px solid var(--nb-border);
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .source-check.checked {
    background: var(--nb-accent);
    border-color: var(--nb-accent);
  }
  .source-check.checked::after {
    content: '✓'; color: white; font-size: 12px; font-weight: 700;
  }
  .source-icon {
    width: 20px; height: 20px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .source-icon svg { width: 20px; height: 20px; }
  .source-icon.syllabus { color: var(--nb-accent); }
  .source-icon.lecture { color: #e37400; }
  .source-icon.textbook { color: #c5221f; }
  .source-icon.pset { color: var(--nb-green); }
  .source-info { flex: 1; min-width: 0; }
  .source-title {
    font-size: 13px; font-weight: 500; color: var(--nb-text);
    line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .source-meta {
    font-size: 11px; color: var(--nb-text-sec); margin-top: 2px;
  }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--nb-bg);
  }
  .main-header {
    height: 56px;
    border-bottom: 1px solid var(--nb-border);
    display: flex; align-items: center;
    padding: 0 28px;
    background: white;
    flex-shrink: 0;
    gap: 16px;
  }
  .tab {
    font-size: 14px; font-weight: 500; color: var(--nb-text-sec);
    padding: 16px 4px;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .tab.active { color: var(--nb-accent); border-bottom-color: var(--nb-accent); }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 28px 0;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

  .user-msg {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 20px;
    max-width: 800px;
    margin-left: auto; margin-right: auto;
    padding: 0 40px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .user-msg.visible { opacity: 1; transform: translateY(0); }
  .user-bubble {
    background: var(--nb-user-bg);
    color: var(--nb-text);
    padding: 12px 18px;
    border-radius: 18px 18px 4px 18px;
    font-size: 14px;
    line-height: 1.6;
    max-width: 680px;
  }

  .nb-response {
    max-width: 800px;
    margin: 0 auto 24px;
    padding: 0 40px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .nb-response.visible { opacity: 1; transform: translateY(0); }
  .nb-response-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .nb-icon {
    width: 24px; height: 24px;
    background: linear-gradient(135deg, #4285f4, #34a853);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .nb-icon-text { color: white; font-size: 11px; font-weight: 700; }
  .nb-label { font-size: 13px; font-weight: 500; color: var(--nb-text-sec); }
  .nb-body {
    padding-left: 32px;
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--nb-text);
  }
  .nb-body h2 {
    font-family: 'Google Sans', sans-serif;
    font-size: 16px; font-weight: 700;
    margin: 18px 0 8px; color: var(--nb-text);
  }
  .nb-body h2:first-child { margin-top: 0; }
  .nb-body p { margin: 6px 0; }
  .nb-body strong { font-weight: 600; }
  .nb-body em { font-style: italic; color: var(--nb-text-sec); }
  .nb-body ul, .nb-body ol { margin: 6px 0 6px 18px; }
  .nb-body li { margin: 3px 0; }

  /* Evaluation styling */
  .eval-correct {
    color: var(--nb-correct);
    font-weight: 500;
  }
  .eval-incomplete {
    color: var(--nb-warning);
    font-weight: 500;
  }

  .stream-chunk {
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .stream-chunk.visible { opacity: 1; }

  /* Input */
  .input-area {
    border-top: 1px solid var(--nb-border);
    padding: 14px 28px 18px;
    background: white;
    flex-shrink: 0;
  }
  .input-box {
    max-width: 800px;
    margin: 0 auto;
    background: var(--nb-source-bg);
    border: 1px solid var(--nb-border);
    border-radius: 24px;
    padding: 12px 20px;
    font-size: 14px;
    color: var(--nb-text);
    display: flex; align-items: center;
  }
  .input-box .placeholder { color: #999; }

  .typing-cursor {
    display: inline-block;
    width: 2px; height: 16px;
    background: var(--nb-text);
    margin-left: 1px;
    vertical-align: text-bottom;
    animation: blink 0.8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>
</head>
<body>
<div class="container">
  <!-- Source Panel -->
  <div class="source-panel">
    <div class="source-header">
      <div class="source-header-top">
        <div class="nb-logo">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="nb-title">NotebookLM</div>
      </div>
      <div class="notebook-name">ECON 101 — Midterm Exam Prep</div>
      <div class="source-count" id="sourceCount">0 sources</div>
    </div>
    <div class="source-list" id="sourceList"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="main-header">
      <div class="tab active">Chat</div>
      <div class="tab">Studio</div>
      <div class="tab">Notes</div>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-area">
      <div class="input-box" id="inputBox">
        <span class="placeholder">Ask NotebookLM about your sources...</span>
      </div>
    </div>
  </div>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const inputBox = document.getElementById('inputBox');
const sourceList = document.getElementById('sourceList');
const sourceCountEl = document.getElementById('sourceCount');

const sources = [
  { title: 'Syllabus — ECON 101: Principles of Microeconomics (Fall 2026)', type: 'syllabus' },
  { title: 'Lecture Notes — Weeks 1-2: Supply and Demand', type: 'lecture' },
  { title: 'Lecture Notes — Week 3: Price Elasticity', type: 'lecture' },
  { title: 'Lecture Notes — Week 4: Market Structures', type: 'lecture' },
  { title: 'Chapter 3-4: Supply, Demand, and Market Equilibrium (textbook PDF)', type: 'textbook' },
  { title: 'Chapter 5: Elasticity and Its Applications (textbook PDF)', type: 'textbook' },
  { title: 'Problem Set 1 (with solutions)', type: 'pset' },
  { title: 'Problem Set 2 (with solutions)', type: 'pset' },
];

const svgDoc = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>`;
const svgBook = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>`;
const svgAssignment = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>`;

const typeMap = { syllabus: 'syllabus', lecture: 'lecture', textbook: 'textbook', pset: 'pset' };
const labelMap = { syllabus: 'Syllabus', lecture: 'Lecture Notes', textbook: 'Textbook PDF', pset: 'Problem Set' };
function iconFor(type) {
  if (type === 'textbook') return svgBook;
  if (type === 'pset') return svgAssignment;
  return svgDoc;
}

function addSource(i) {
  const s = sources[i];
  const el = document.createElement('div');
  el.className = 'source-item';
  el.innerHTML = `
    <div class="source-check checked"></div>
    <div class="source-icon ${s.type}">${iconFor(s.type)}</div>
    <div class="source-info">
      <div class="source-title">${s.title}</div>
      <div class="source-meta">${labelMap[s.type]}</div>
    </div>
  `;
  sourceList.appendChild(el);
  requestAnimationFrame(() => el.classList.add('visible'));
  sourceCountEl.textContent = `${i + 1} source${i > 0 ? 's' : ''}`;
}

function scrollToBottom() {
  chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
}

function addUserMsg(text) {
  const el = document.createElement('div');
  el.className = 'user-msg';
  el.innerHTML = `<div class="user-bubble">${text}</div>`;
  chatArea.appendChild(el);
  requestAnimationFrame(() => { el.classList.add('visible'); scrollToBottom(); });
}

function addNbResponse(id, bodyHtml) {
  const el = document.createElement('div');
  el.className = 'nb-response';
  el.id = id;
  el.innerHTML = `
    <div class="nb-response-header">
      <div class="nb-icon"><span class="nb-icon-text">N</span></div>
      <div class="nb-label">NotebookLM</div>
    </div>
    <div class="nb-body">${bodyHtml}</div>
  `;
  chatArea.appendChild(el);
  requestAnimationFrame(() => { el.classList.add('visible'); scrollToBottom(); });
  return el;
}

function streamChunks(containerId, count, delay, callback) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const chunks = container.querySelectorAll('.stream-chunk');
  let i = 0;
  function next() {
    if (i < chunks.length && i < count) {
      chunks[i].classList.add('visible');
      scrollToBottom();
      i++;
      setTimeout(next, delay);
    } else if (callback) callback();
  }
  next();
}

function typeInInput(text, duration, callback) {
  inputBox.innerHTML = '';
  let i = 0;
  const charDelay = duration / text.length;
  const cursor = document.createElement('span');
  cursor.className = 'typing-cursor';
  function typeChar() {
    if (i < text.length) {
      inputBox.textContent = text.substring(0, i + 1);
      inputBox.appendChild(cursor);
      i++;
      setTimeout(typeChar, charDelay);
    } else if (callback) setTimeout(callback, 400);
  }
  typeChar();
}

function clearInput() {
  inputBox.innerHTML = '<span class="placeholder">Ask NotebookLM about your sources...</span>';
}

// =================== TIMELINE ===================
function runDemo() {
  let t = 0;

  // Phase 1: Add sources
  for (let i = 0; i < sources.length; i++) {
    setTimeout(() => addSource(i), t + i * 600);
  }
  t += sources.length * 600 + 3000;

  // Phase 2: Prompt 1 — Topic mapping
  setTimeout(() => {
    typeInInput(
      'What are the major topics covered in these materials? Rank them from most to least important based on how much content we have on each.',
      6000,
      () => {
        setTimeout(() => {
          clearInput();
          addUserMsg('What are the major topics covered in these materials? Rank them from most to least important based on how much content we have on each.');
          setTimeout(showResponse1, 1000);
        }, 500);
      }
    );
  }, t);
  t += 8500;

  function showResponse1() {
    const chunks = [
      `<h2>Topics Ranked by Content Coverage</h2>`,
      `<p>1. <strong>Supply and Demand</strong> — Most extensive coverage. Two full weeks of lectures, textbook chapters 3-4, and Problem Set 1 entirely devoted to this topic. Core concepts: demand curves, supply curves, market equilibrium, shifts vs. movements, price determination, surplus and shortage.</p>`,
      `<p>2. <strong>Price Elasticity</strong> — Full week of lectures plus textbook chapter 5. Covers price elasticity of demand, income elasticity, cross-price elasticity, elasticity of supply, determinants of elasticity, total revenue test. Problem Set 2 focuses here.</p>`,
      `<p>3. <strong>Market Structures</strong> — One week of lectures (Week 4). Perfect competition, monopoly, oligopoly, monopolistic competition. Less depth than the first two topics based on available materials.</p>`,
      `<p>4. <strong>Welfare Economics</strong> — Covered within the supply/demand materials as an extension. Consumer surplus, producer surplus, deadweight loss, market efficiency. Not a standalone unit but woven through.</p>`,
      `<p>5. <strong>Government Intervention</strong> — Briefest coverage. Price ceilings, price floors, taxes, subsidies mentioned in lectures and briefly in the textbook. Likely worth understanding but least likely to be the focus of exam questions.</p>`,
      `<h2>Study Time Recommendation</h2>`,
      `<p>Weight your preparation toward topics 1-3. Supply and demand alone probably accounts for 40% of the exam based on the volume of material devoted to it.</p>`,
    ];
    const html = chunks.map(c => `<span class="stream-chunk">${c}</span>`).join('');
    addNbResponse('resp1', html);
    streamChunks('resp1', chunks.length, 4500, () => {
      setTimeout(doPrompt2, 5000);
    });
  }

  // Phase 3: Prompt 2 — Practice questions
  function doPrompt2() {
    typeInInput(
      'Create five exam-style questions for Supply and Demand. Include factual recall, conceptual understanding, and application questions. After I answer, evaluate my response and identify gaps.',
      6500,
      () => {
        setTimeout(() => {
          clearInput();
          addUserMsg('Create five exam-style questions for Supply and Demand. Include factual recall, conceptual understanding, and application questions. After I answer, evaluate my response and identify gaps.');
          setTimeout(showResponse2, 1000);
        }, 500);
      }
    );
  }

  function showResponse2() {
    const chunks = [
      `<h2>Practice Questions: Supply and Demand</h2>`,
      `<p><strong>Q1 (Factual Recall):</strong> What is the law of demand? State it precisely.</p>`,
      `<p><strong>Q2 (Conceptual):</strong> Explain the difference between a "change in quantity demanded" and a "change in demand." What causes each?</p>`,
      `<p><strong>Q3 (Application):</strong> The government imposes a new tax on coffee imports. Using supply and demand analysis, predict what happens to the equilibrium price and quantity of coffee in the domestic market. Which curve shifts, and in which direction?</p>`,
      `<p><strong>Q4 (Application):</strong> If the price of butter increases significantly, what would you expect to happen to the demand for margarine? Explain using the concept of cross-price elasticity.</p>`,
      `<p><strong>Q5 (Conceptual):</strong> A new technology reduces the cost of producing solar panels by 40%. At the same time, the government launches a campaign that increases consumer interest in renewable energy. Analyze the combined effect on the market for solar panels — can you definitively predict what happens to equilibrium price? Why or why not?</p>`,
      `<p>Take your time and answer each one. I'll evaluate your responses.</p>`,
    ];
    const html = chunks.map(c => `<span class="stream-chunk">${c}</span>`).join('');
    addNbResponse('resp2', html);
    streamChunks('resp2', chunks.length, 5000, () => {
      setTimeout(doStudentAnswer, 5000);
    });
  }

  // Phase 4: Student types (wrong) answer
  function doStudentAnswer() {
    const answer = 'Here\'s my answer to Q3: "The tax on coffee imports would shift the supply curve to the left because it increases the cost of bringing coffee into the country. This means equilibrium price goes up and equilibrium quantity goes down."  Evaluate my response. What concept am I misunderstanding or leaving incomplete?';
    typeInInput(answer, 9000, () => {
      setTimeout(() => {
        clearInput();
        addUserMsg('Here\'s my answer to Q3: "The tax on coffee imports would shift the supply curve to the left because it increases the cost of bringing coffee into the country. This means equilibrium price goes up and equilibrium quantity goes down."<br><br>Evaluate my response. What concept am I misunderstanding or leaving incomplete?');
        setTimeout(showResponse3, 1200);
      }, 500);
    });
  }

  // Phase 5: Diagnostic response
  function showResponse3() {
    const chunks = [
      `<h2>Evaluation of Your Answer</h2>`,
      `<p><span class="eval-correct">What you got right:</span> &#10003; You correctly identified that the supply curve shifts left (or up). &#10003; You correctly identified the direction of change: price up, quantity down. &#10003; Your reasoning is logically sound — import taxes increase costs, which reduces supply.</p>`,
      `<p><span class="eval-incomplete">What's incomplete:</span> You described the <em>direction</em> of the changes correctly, but you didn't address <em>magnitude</em>. Your answer treats all supply shifts as equal, but the size of the shift matters enormously for policy analysis.</p>`,
      `<h2>The concept you're missing: Determinants of magnitude</h2>`,
      `<p>How MUCH the price rises and quantity falls depends on the <strong>elasticity of both supply and demand</strong> in this market. If demand for coffee is highly inelastic (people need their coffee regardless of price), most of the tax burden falls on consumers as higher prices with relatively little reduction in quantity. If demand is elastic, quantity drops significantly but price rises less.</p>`,
      `<p>Your Week 3 lecture on elasticity — specifically the section on "tax incidence and elasticity" — covers exactly this interaction. The key insight: <strong>you can't fully analyze a supply shift without considering the elasticity of the demand curve it's shifting against.</strong></p>`,
      `<h2>To strengthen your answer</h2>`,
      `<p>Add one sentence about how the magnitude of price and quantity changes depends on the price elasticity of demand for coffee, and note that coffee demand tends to be relatively inelastic, meaning consumers bear most of the tax burden.</p>`,
    ];
    const html = chunks.map(c => `<span class="stream-chunk">${c}</span>`).join('');
    addNbResponse('resp3', html);
    streamChunks('resp3', chunks.length, 5500, () => {
      setTimeout(() => {
        document.dispatchEvent(new Event('demo-complete'));
      }, 8000);
    });
  }
}

setTimeout(runDemo, 800);
</script>
</body>
</html>
